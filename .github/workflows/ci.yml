name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

env:
  # prisma generate only needs these to be *defined*, not reachable — no
  # real DB connection happens until migrate/studio/the running app.
  DATABASE_URL: "postgresql://ci:ci@localhost:5432/ci"
  DIRECT_URL: "postgresql://ci:ci@localhost:5432/ci"

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - run: pnpm -r typecheck

  build:
    runs-on: ubuntu-latest
    needs: typecheck
    env:
      # Real values, not the CI job's dummy Postgres — needed for Next.js
      # build-time checks (apps/web) to actually validate against Clerk.
      # Set these in the repo's Settings > Secrets > Actions; the build job
      # is skipped-in-effect (fails) until they're added, but typecheck
      # above is the real merge gate and needs none of them.
      NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_SECRET_KEY }}
      NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm db:generate

      - run: pnpm --filter api build

      - run: pnpm --filter web build
